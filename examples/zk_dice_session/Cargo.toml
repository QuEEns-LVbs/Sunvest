[package]
name = "zk_dice_session"
version = "0.1.0"
edition = "2021"
publish = false
description = "Sunvest composition example: fair_dice ZK verification authorized through a session key - no wallet prompt per roll"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# path dep - pending Sunvest-core 1.x publication of circuits::* and session::*
Sunvest-core = { path = "../../" }
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }
Sunvest-core = { path = "../../", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true

[workspace]
