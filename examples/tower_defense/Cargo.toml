[package]
name = "tower_defense"
version = "0.0.1"
edition = "2021"
authors = ["Sunvest Contributors"]
description = "Tower defense on-chain game example using Sunvest-core ECS framework"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
Sunvest-core = "1.1.0"
soroban-sdk = "25.1.0"

[dev-dependencies]
soroban-sdk = { version = "25.1.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
[workspace]
