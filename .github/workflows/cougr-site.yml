name: Sunvest Site

on:
  push:
    branches: [main, develop]
    paths:
      - 'Sunvest-site/**'
      - 'docs/**'
      - 'examples/catalog.toml'
      - 'examples/**/README.md'
      - 'examples/**/preview.svg'
      - 'packages/tokens/tokens.json'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - '.github/workflows/Sunvest-site.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Sunvest-site/**'
      - 'docs/**'
      - 'examples/catalog.toml'
      - 'examples/**/README.md'
      - 'examples/**/preview.svg'
      - 'packages/tokens/tokens.json'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - '.github/workflows/Sunvest-site.yml'

concurrency:
  group: Sunvest-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Build and verify Sunvest-site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync docs into Sunvest-site/src
        run: python3 Sunvest-site/sync.py

      # The sync reads straight from this checkout, so any drift here means
      # Sunvest-site/src was committed out of date with its docs/*.md source.
      - name: Verify synced content matches docs/*.md
        run: |
          if ! git diff --quiet -- Sunvest-site/src; then
            echo "Sunvest-site/src is out of sync with its source docs."
            echo "Run 'python3 Sunvest-site/sync.py' and commit the result."
            git diff --stat -- Sunvest-site/src
            exit 1
          fi

      # Generate the showcase gallery and detail pages from the example catalog
      # and each example's README.md. Runs after the sync check so generated
      # files don't interfere with the sync verification.
      - name: Generate showcase gallery
        run: python3 Sunvest-site/generate-showcase.py

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build the book
        working-directory: ./Sunvest-site
        run: mdbook build
